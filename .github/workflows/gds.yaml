name: gds

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python and dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Tiny Tapeout Action
        uses: tinytapeout/tt-gds-action@main
        with:
          install_tools: true
        env:
          TT_ARGS: "--pdk sky130A"      # <--- ΑΥΤΗ Η ΓΡΑΜΜΗ ΓΕΜΙΖΕΙ ΤΟ $TT_ARGS ΜΕ ΤΟ ΣΩΣΤΟ PDK!
          PDK: "sky130A"
          PDK_ROOT: "/usr/share/pdk"
