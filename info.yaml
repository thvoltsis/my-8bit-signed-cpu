yaml_version: 6

project:
  title:        "8-bit Signed CPU"      
  description:  "A modular 24-pin 8-bit Signed CPU with 16 ALU operations and LOAD/STORE capabilities"
  author:       "Student"               
  language:     "SystemVerilog"
  clock_hz:     10000000                
  tiles:        "1x1"                   

  # Διαβάζουμε τα αρχεία απευθείας από την αρχική σελίδα, όπως ακριβώς φαίνονται στη φωτογραφία σου!
  source_files:
    - "project.sv"
    - "alu.sv"
    - "ram.sv"
    - "control.sv"
    - "edge_detector.sv"

  top_module:  "tt_um_top"              

pinout:
  ui:
    - "LIVE Data Bit 0"
    - "LIVE Data Bit 1"
    - "LIVE Data Bit 2"
    - "LIVE Data Bit 3"
    - "LIVE Data Bit 4"
    - "LIVE Data Bit 5"
    - "LIVE Data Bit 6"
    - "LIVE Data Bit 7"
  uo:
    - "Accumulator LED Bit 0"
    - "Accumulator LED Bit 1"
    - "Accumulator LED Bit 2"
    - "Accumulator LED Bit 3"
    - "Accumulator LED Bit 4"
    - "Accumulator LED Bit 5"
    - "Accumulator LED Bit 6"
    - "Accumulator LED Bit 7"
  uio:
    - "LIVE Opcode Bit 0"
    - "LIVE Opcode Bit 1"
    - "LIVE Opcode Bit 2"
    - "LIVE Opcode Bit 3"
    - "Clock Source Select"
    - "Mode Select"
    - "Manual Clock Step Button"
    - "Overflow Flag LED"
