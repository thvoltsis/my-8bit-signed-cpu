yaml_version: 6

project:
  title:        "8-bit Signed CPU"      
  description:  "A modular 24-pin 8-bit Signed CPU with 16 ALU operations and LOAD/STORE capabilities"
  author:       "Student"               
  language:     "SystemVerilog"
  clock_hz:     10000000                
  tiles:        "1x1"                   

  # Ορίζουμε ρητά ότι τα αρχεία είναι στον τρέχοντα κεντρικό κατάλογο
  source_files:
    - "./project.sv"
    - "./alu.sv"
    - "./ram.sv"
    - "./control.sv"
    - "./edge_detector.sv"

  top_module:  "tt_um_top"              

pinout:
  ui: "LIVE Data Bit 0"
  ui: "LIVE Data Bit 1"
  ui: "LIVE Data Bit 2"
  ui: "LIVE Data Bit 3"
  ui: "LIVE Data Bit 4"
  ui: "LIVE Data Bit 5"
  ui: "LIVE Data Bit 6"
  ui: "LIVE Data Bit 7"
  uo: "Accumulator LED Bit 0"
  uo: "Accumulator LED Bit 1"
  uo: "Accumulator LED Bit 2"
  uo: "Accumulator LED Bit 3"
  uo: "Accumulator LED Bit 4"
  uo: "Accumulator LED Bit 5"
  uo: "Accumulator LED Bit 6"
  uo: "Accumulator LED Bit 7"
  uio: "LIVE Opcode Bit 0"
  uio: "LIVE Opcode Bit 1"
  uio: "LIVE Opcode Bit 2"
  uio: "LIVE Opcode Bit 3"
  uio: "Clock Source Select"
  uio: "Mode Select"
  uio: "Manual Clock Step Button"
  uio: "Overflow Flag LED"
